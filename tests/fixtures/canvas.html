<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canvas slide</title>
<style>@page { size: 720pt 405pt; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 720pt; height: 405pt; overflow: hidden; padding: 40pt 60pt; background: #FFF7ED; font-family: sans-serif; }
  h1 { font-size: 28pt; }
  p { margin-top: 12pt; font-size: 14pt; }
</style>
</head>
<body>
  <h1>One slide per file</h1>
  <p>The page is drawn on a fixed 720pt × 405pt canvas.</p>
</body>
</html>
